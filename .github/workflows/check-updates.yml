name: Check upstream updates

# Weekly: check if newer releases/tags are published upstream for the pinned
# third-party packages. If so, bump the pinned version and open a draft PR
# per upstream for review. Never merges automatically — a human reviews,
# rebuilds and smoke-tests on hardware before merging.

on:
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC
  workflow_dispatch: {}  # manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream-updates
  cancel-in-progress: true

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tetra-bluestation
            # Latest *release* via the releases API
            latest_cmd: >
              curl -sfL -H 'Accept: application/vnd.github+json'
              https://api.github.com/repos/MidnightBlueLabs/tetra-bluestation/releases/latest
              | grep -m1 '"tag_name"' | cut -d'"' -f4
          - name: mu-cell-bb-drivers
            # Latest *tag* (the driver repo has no GitHub releases)
            latest_cmd: >
              curl -sfL -H 'Accept: application/vnd.github+json'
              https://api.github.com/repos/Jankyneering/mu-cell-bb-drivers/tags
              | grep -m1 '"name"' | cut -d'"' -f4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ${{ matrix.name }}
        id: check
        run: |
          case "${{ matrix.name }}" in
            tetra-bluestation)
              MK="board/universal/packages/tetra-bluestation/tetra-bluestation.mk"
              VAR="TETRA_BLUESTATION_VERSION"
              ;;
            mu-cell-bb-drivers)
              MK="board/universal/packages/soapy-mu-cell/soapy-mu-cell.mk"
              MK2="board/universal/packages/mu-cell-bb-dts/mu-cell-bb-dts.mk"
              VAR="SOAPY_MU_CELL_VERSION"
              ;;
          esac

          current=$(grep -m1 "^${VAR}" "$MK" | cut -d' ' -f3)
          latest=$( ${{ matrix.latest_cmd }} )

          if [ -z "$latest" ]; then
            echo "Could not reach GitHub API for ${{ matrix.name }}" >&2
            exit 1
          fi

          if [ "$current" = "$latest" ]; then
            echo "${{ matrix.name }}: up-to-date ($current)"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${{ matrix.name }}: $current -> $latest"
          sed -i "s|^${VAR} = .*|${VAR} = $latest|" "$MK"
          if [ -n "${MK2:-}" ]; then
            sed -i "s|^MU_CELL_BB_DTS_VERSION = .*|MU_CELL_BB_DTS_VERSION = $latest|" "$MK2"
          fi

          # A bumped cargo package needs its vendored-tarball sha256
          # recomputed; blank the .hash so the CI build workflow's
          # self-heal refreshes and commits the correct value.
          if [ "${{ matrix.name }}" = "tetra-bluestation" ]; then
            printf '# Regenerated by the CI build workflow after the\n# download of %s runs (vendored-tarball sha256).\n' "$latest" \
              > board/universal/packages/tetra-bluestation/tetra-bluestation.hash
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Create draft PR for ${{ matrix.name }}
        if: steps.check.outputs.bump == 'true'
        run: |
          latest="${{ steps.check.outputs.latest }}"
          case "${{ matrix.name }}" in
            tetra-bluestation)
              files="board/universal/packages/tetra-bluestation/"
              title="Bump tetra-bluestation to $latest"
              body=$(cat <<EOF
          Automated weekly check found a new tetra-bluestation release.

          ## Summary
          - Bumps the pinned tetra-bluestation source version to \`$latest\`
          - The cargo .hash file is reset; the CI build workflow regenerates
            and commits the vendored-tarball sha256 on first build

          ## Review checklist
          - [ ] Check the upstream release notes for breaking changes
          - [ ] Rebuild an image and smoke-test \`bluestation-bs\` on a board before merging
          EOF
              )
              ;;
            mu-cell-bb-drivers)
              files="board/universal/packages/soapy-mu-cell/ board/universal/packages/mu-cell-bb-dts/"
              title="Bump mu-cell-bb-drivers to $latest"
              body=$(cat <<EOF
          Automated weekly check found a new mu-cell-bb-drivers tag.

          ## Summary
          - Bumps the pinned SoapyMuCell driver and µCell DTS overlay to \`$latest\`
          - Both packages stay in sync (same upstream repo)

          ## Review checklist
          - [ ] Check what changed in the driver repo since the current pin
          - [ ] Rebuild, flash and verify on hardware: \`muneuron probe\` must pass
          - [ ] A reboot is required after flashing so the new DTS overlay loads
          EOF
              )
              ;;
          esac

          branch="updates/${{ matrix.name }}-${latest}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add $files
          git commit -m "$title"
          git push origin "$branch"
          gh pr create --draft --title "$title" --body "$body" --head "$branch"
        env:
          GH_TOKEN: ${{ github.token }}
